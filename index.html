<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MysticLand — Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #0D0A1A;
      color: #F0EAFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 36px; color: #C9A84C; letter-spacing: 3px; margin-bottom: 8px; }
    .tagline { font-size: 15px; color: #9E8B75; font-style: italic; margin-bottom: 48px; }
    .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #1A1030;
      border: 1px solid #C9A84C44;
      border-radius: 16px;
      padding: 32px 40px;
      width: 260px;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: #C9A84C; transform: translateY(-4px); }
    .card-icon { font-size: 40px; margin-bottom: 16px; }
    .card-title { font-size: 18px; color: #C9A84C; font-weight: bold; margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: #9E8B75; }
    footer { margin-top: 64px; font-size: 13px; color: #9E8B75; }
    footer a { color: #C9A84C; text-decoration: none; }
  </style>
</head>
<body>
  <div class="logo">🎭</div>
  <h1>MYSTICLAND</h1>
  <div class="tagline">Where mystery meets desire</div>
  <div class="cards">
    <a class="card" href="privacy-policy.html">
      <div class="card-icon">🛡️</div>
      <div class="card-title">Privacy Policy</div>
      <div class="card-desc">How we collect, use, and protect your data</div>
    </a>
    <a class="card" href="terms-and-conditions.html">
      <div class="card-icon">📄</div>
      <div class="card-title">Terms & Conditions</div>
      <div class="card-desc">Rules and guidelines for using MysticLand</div>
    </a>
  </div>
  <footer>
    <p>© 2026 MysticLand. All rights reserved.</p>
    <p style="margin-top:8px;">Questions? <a href="mailto:mysticland.app@gmail.com">mysticland.app@gmail.com</a></p>
  </footer>
</body>
</html>
